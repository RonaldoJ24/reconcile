[project]
name = "reconcile"
version = "0.1.0"
description = "Deterministic payment allocation review service"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "python-multipart>=0.0.9,<1",
  "scikit-learn>=1.5,<2",
  "sqlalchemy>=2.0,<3",
  "threadpoolctl>=3.5,<4",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
  "hypothesis>=6.0,<7",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[project.scripts]
reconcile-worker = "reconcile.jobs.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/reconcile"]

[tool.pytest.ini_options]
pythonpath = ["backend/src"]
testpaths = ["backend/tests"]
markers = [
  "postgres: requires TEST_DATABASE_URL and an isolated PostgreSQL database/schema",
]

[tool.ruff]
line-length = 100
src = ["backend/src", "backend/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
