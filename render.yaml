services:
  - type: web
    name: reconcile-preview
    runtime: docker
    plan: free
    autoDeployTrigger: "off"
    healthCheckPath: /api/v1/health
    envVars:
      - key: RECONCILE_MODE
        value: preview
      - key: RECONCILE_RANKER_MODE
        value: shadow
      - key: RECONCILE_WORKER_MODE
        value: web_lifecycle
      - key: RECONCILE_LLM_ENABLED
        value: "0"
      - key: RECONCILE_LLM_MODEL
        value: deepseek-flash
      - key: RECONCILE_LLM_EXECUTION_BUDGET_USD
        value: "0"
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
