<svg xmlns="http://www.w3.org/2000/svg" width="760" height="394" viewBox="0 0 760 394" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>How often each model's proposals were right</title>
  <rect x="0.5" y="0.5" width="759" height="393" rx="14" fill="#ffffff" stroke="#dbe3ea"/>
  <text x="32.0" y="46.0" font-size="23" font-weight="700" fill="#112d4e" text-anchor="start">How often a proposal was right</text>
  <text x="32.0" y="72.0" font-size="14" font-weight="400" fill="#5c7084" text-anchor="start">Each bar is one model's proposals, split into right and wrong; length shows how many.</text>
  <rect x="32.0" y="95.0" width="13.0" height="13.0" rx="3" fill="#1f7a4d"/>
  <text x="52.0" y="106.0" font-size="13" font-weight="400" fill="#183047" text-anchor="start">Right</text>
  <rect x="98.5" y="95.0" width="13.0" height="13.0" rx="3" fill="#c2413b"/>
  <text x="118.5" y="106.0" font-size="13" font-weight="400" fill="#183047" text-anchor="start">Wrong</text>
  <text x="32.0" y="132.0" font-size="16" font-weight="700" fill="#183047" text-anchor="start">40-case split</text>
  <text x="32.0" y="163.0" font-size="13" font-weight="400" fill="#183047" text-anchor="start">DeepSeek, 23 proposals</text>
  <rect x="210.0" y="146.0" width="96.5" height="24.0" rx="0" fill="#1f7a4d"/>
  <text x="258.2" y="163.0" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">21</text>
  <rect x="306.5" y="146.0" width="9.2" height="24.0" rx="0" fill="#c2413b"/>
  <text x="327.7" y="164.0" font-size="14" font-weight="700" fill="#112d4e" text-anchor="start">91% right, 2 wrong</text>
  <text x="32.0" y="195.0" font-size="13" font-weight="400" fill="#183047" text-anchor="start">GPT-6 Luna, 16 proposals</text>
  <rect x="210.0" y="178.0" width="68.9" height="24.0" rx="0" fill="#1f7a4d"/>
  <text x="244.5" y="195.0" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">15</text>
  <rect x="278.9" y="178.0" width="4.6" height="24.0" rx="0" fill="#c2413b"/>
  <text x="295.5" y="196.0" font-size="14" font-weight="700" fill="#112d4e" text-anchor="start">94% right, 1 wrong</text>
  <text x="32.0" y="234.0" font-size="16" font-weight="700" fill="#183047" text-anchor="start">All cases</text>
  <text x="32.0" y="265.0" font-size="13" font-weight="400" fill="#183047" text-anchor="start">DeepSeek, 74 proposals</text>
  <rect x="210.0" y="248.0" width="280.3" height="24.0" rx="0" fill="#1f7a4d"/>
  <text x="350.1" y="265.0" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">61</text>
  <rect x="490.3" y="248.0" width="59.7" height="24.0" rx="0" fill="#c2413b"/>
  <text x="520.1" y="265.0" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">13</text>
  <text x="562.0" y="266.0" font-size="14" font-weight="700" fill="#112d4e" text-anchor="start">82% right, 13 wrong</text>
  <text x="32.0" y="297.0" font-size="13" font-weight="400" fill="#183047" text-anchor="start">GPT-6 Luna, 53 proposals</text>
  <rect x="210.0" y="280.0" width="229.7" height="24.0" rx="0" fill="#1f7a4d"/>
  <text x="324.9" y="297.0" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">50</text>
  <rect x="439.7" y="280.0" width="13.8" height="24.0" rx="0" fill="#c2413b"/>
  <text x="465.5" y="298.0" font-size="14" font-weight="700" fill="#112d4e" text-anchor="start">94% right, 3 wrong</text>
  <text x="32.0" y="356.0" font-size="12" font-weight="400" fill="#5c7084" text-anchor="start">Same 178 synthetic cases written by AI agents. DeepSeek run pre-registered; GPT-6 Luna run after the cases were public.</text>
  <text x="32.0" y="373.0" font-size="12" font-weight="400" fill="#5c7084" text-anchor="start">Synthetic results, not real-world accuracy. Source: github.com/RonaldoJ24/reconcile</text>
</svg>
