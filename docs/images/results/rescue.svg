<svg xmlns="http://www.w3.org/2000/svg" width="760" height="376" viewBox="0 0 760 376" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Payments the rules missed, resolved by each model</title>
  <rect x="0.5" y="0.5" width="759" height="375" rx="14" fill="#ffffff" stroke="#dbe3ea"/>
  <text x="32.0" y="46.0" font-size="23" font-weight="700" fill="#112d4e" text-anchor="start">Payments the rules missed, resolved by each model</text>
  <text x="32.0" y="72.0" font-size="14" font-weight="400" fill="#5c7084" text-anchor="start">Answerable payments the rules sent to a person, and how many each model then got right.</text>
  <text x="32.0" y="114.0" font-size="16" font-weight="700" fill="#183047" text-anchor="start">Held-out split</text>
  <text x="32.0" y="145.0" font-size="13" font-weight="400" fill="#183047" text-anchor="start">DeepSeek, 20 of 33</text>
  <rect x="210.0" y="128.0" width="440.0" height="24.0" rx="5" fill="#eef2f5"/>
  <rect x="210.0" y="128.0" width="266.7" height="24.0" rx="5" fill="#8fb0d0"/>
  <text x="664.0" y="147.0" font-size="18" font-weight="700" fill="#112d4e" text-anchor="start">61%</text>
  <text x="32.0" y="177.0" font-size="13" font-weight="400" fill="#183047" text-anchor="start">GPT-6 Luna, 14 of 33</text>
  <rect x="210.0" y="160.0" width="440.0" height="24.0" rx="5" fill="#eef2f5"/>
  <rect x="210.0" y="160.0" width="186.7" height="24.0" rx="5" fill="#1a65a8"/>
  <text x="664.0" y="179.0" font-size="18" font-weight="700" fill="#112d4e" text-anchor="start">42%</text>
  <text x="32.0" y="216.0" font-size="16" font-weight="700" fill="#183047" text-anchor="start">All cases</text>
  <text x="32.0" y="247.0" font-size="13" font-weight="400" fill="#183047" text-anchor="start">DeepSeek, 59 of 125</text>
  <rect x="210.0" y="230.0" width="440.0" height="24.0" rx="5" fill="#eef2f5"/>
  <rect x="210.0" y="230.0" width="207.7" height="24.0" rx="5" fill="#8fb0d0"/>
  <text x="664.0" y="249.0" font-size="18" font-weight="700" fill="#112d4e" text-anchor="start">47%</text>
  <text x="32.0" y="279.0" font-size="13" font-weight="400" fill="#183047" text-anchor="start">GPT-6 Luna, 48 of 125</text>
  <rect x="210.0" y="262.0" width="440.0" height="24.0" rx="5" fill="#eef2f5"/>
  <rect x="210.0" y="262.0" width="169.0" height="24.0" rx="5" fill="#1a65a8"/>
  <text x="664.0" y="281.0" font-size="18" font-weight="700" fill="#112d4e" text-anchor="start">38%</text>
  <text x="32.0" y="338.0" font-size="12" font-weight="400" fill="#5c7084" text-anchor="start">Same 178 synthetic cases written by AI agents. DeepSeek run pre-registered; GPT-6 Luna run after the cases were public.</text>
  <text x="32.0" y="355.0" font-size="12" font-weight="400" fill="#5c7084" text-anchor="start">Synthetic results, not real-world accuracy. Source: github.com/RonaldoJ24/reconcile</text>
</svg>
