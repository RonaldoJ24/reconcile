  <text x="32.0" y="302.0" font-size="12" font-weight="400" fill="#5c7084" text-anchor="start">Evaluation v2, 2026-09-23: 178 synthetic cases written by AI agents; pre-registered, run once.</text>
  <text x="32.0" y="319.0" font-size="12" font-weight="400" fill="#5c7084" text-anchor="start">Synthetic results, not real-world accuracy. Source: github.com/RonaldoJ24/reconcile</text>
